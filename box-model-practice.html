<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Box Model</title>
<style>
body {
    font-family: Arial, sans-serif;
}

/* Container to see margins clearly */
.container {
    display: flex;
    gap: 20px;
    padding: 20px;
}

/* Box styling */
.box {
    width: 150px;
    padding: 20px;              /* padding area */
    border: 5px solid black;    /* border */
    margin: 20px;               /* margin */
    background-color: lightblue; /* content area */
    text-align: center;
}
</style>
</head>
<body>

<div class="container">
    <div class="box">Box 1</div>
    <div class="box">Box 2</div>
    <div class="box">Box 3</div>
    <div class="box">Box 4</div>
</div>

</body>
</html>

//Exercise 3
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Card</title>
<style>
body {
    font-family: Arial, sans-serif;
}

/* Card container */
.card {
    width: 300px;
    border: 1px solid gray;
    padding: 20px;
    box-sizing: border-box;
}

/* Image */
.card img {
    width: 100%;
    display: block;
    margin-bottom: 15px;
}

/* Title */
.card h2 {
    margin-bottom: 15px;
}

/* Description */
.card p {
    margin-bottom: 15px;
}

/* Button */
.card button {
    padding: 10px;
    width: 100%;
    background-color: black;
    color: white;
    border: none;
    cursor: pointer;
}
</style>
</head>
<body>

<div class="card">
    <img src="https://via.placeholder.com/300x150" alt="Card Image">
    <h2>Card Title</h2>
    <p>This is a simple card description with clean spacing.</p>
    <button>Click Me</button>
</div>

</body>
</html>
